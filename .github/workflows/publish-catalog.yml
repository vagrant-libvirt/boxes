name: Publish Catalog

# Not triggered by `release` events: a release-triggered run carries the tag as
# its ref, which the github-pages environment rejects because it only allows
# deployments from the default branch. scripts/publish-box.sh dispatches this
# workflow on main instead, after creating or updating a release.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'catalog.json'
      - 'scripts/build-catalog.py'
      - '.github/workflows/publish-catalog.yml'

# allow one concurrent deployment, skipping queued runs in between
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # building and deploying are separate jobs because actions/deploy-pages can
  # only look up the artifact once the job that uploaded it has finished
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
    - uses: actions/checkout@v5
    - name: Build catalog
      run: ./scripts/build-catalog.py --repo ${{ github.repository }} --out site
    - name: Show catalog
      run: |
        for metadata in site/*.json; do
          echo "--- ${metadata}"
          cat "${metadata}"
        done
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: site

  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      # actions/deploy-pages reads the uploaded artifact through the Actions API
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - id: deploy
      uses: actions/deploy-pages@v5
